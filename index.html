<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Flauta Dulce · Pentagrama y Digitación</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#f8fafc;--mut:#94a3b8;--acc:#38bdf8;--play:#ef4444;--warn:#f59e0b}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);margin:0;padding:16px;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{margin:4px 0;color:var(--acc);font-size:1.5rem;text-align:center}
.sub{color:var(--mut);margin:0 0 18px;text-align:center;font-size:.9rem}
.panel{background:var(--card);border-radius:12px;padding:14px 18px;width:100%;max-width:900px;margin-bottom:14px;box-shadow:0 10px 25px -5px rgba(0,0,0,.3)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
button{background:var(--acc);color:#0f172a;font-weight:700;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-size:.95rem}
button:disabled{opacity:.4;cursor:not-allowed}
button.sec{background:#334155;color:var(--txt)}
input[type=file]{color:var(--mut);max-width:100%}
.info{color:var(--mut);font-size:.85rem;line-height:1.4}
#btnPlay{min-width:150px}
#btnStop{min-width:110px}
.tempo{display:flex;flex-direction:column;gap:6px;width:100%;margin-top:12px}
.tempo label{white-space:nowrap}
.tempo input[type=range]{width:100%;accent-color:var(--acc)}

/* Escenario */
.stage{position:relative;width:100%;max-width:900px;height:200px;background:#020617;border:2px solid var(--line);border-radius:16px;overflow:hidden}
.partitura{position:absolute;left:0;top:4px;overflow:visible}
.clave{position:absolute;left:0;top:4px;z-index:4}
.playhead{position:absolute;top:6px;bottom:6px;left:30%;width:2px;background:var(--play);box-shadow:0 0 8px var(--play);z-index:5}
.cuenta{position:absolute;top:6px;left:calc(30% + 10px);font-size:1.6rem;font-weight:800;color:var(--play);z-index:6;pointer-events:none}

/* Elementos SVG */
.linea{stroke:#94a3b8;stroke-width:1.2}
.comp{fill:#f8fafc;font:700 16px serif}
.nota .plica{stroke:#f8fafc;stroke-width:1.4}
.bandera{fill:none;stroke:#f8fafc;stroke-width:1.6}
.cabeza{stroke:#f8fafc;stroke-width:1.6}
.cabeza.solida{fill:#f8fafc}
.cabeza.hueca{fill:none}
.alt{fill:#f8fafc;font-size:15px}
.pt{fill:#f8fafc}
.nombre{fill:#94a3b8;font-size:11px;text-anchor:middle}
.nota .mini{opacity:.6}
.nota.act .mini{opacity:1}
.nota.act .cabeza,.nota.act .plica{stroke:var(--acc)}
.nota.act .solida{fill:var(--acc)}
.nota.act .nombre{fill:var(--acc);font-weight:700}
.nota.pend .mini{opacity:.35}
.nota.pend .nombre{fill:var(--warn)}

#msg{color:var(--warn);font-size:.85rem;min-height:1.2em;text-align:center;margin-top:6px}
</style>
</head>
<body>

<h1>🎼 Flauta Dulce · Pentagrama y Digitación</h1>
<p class="sub">Pentagrama en desplazamiento con digitación sobre cada nota · reproducción programada en el reloj de Web Audio</p>

<div class="panel">
  <div class="row">
    <button id="btnPlay">▶ Reproducir</button>
    <button id="btnStop" class="sec">■ Parar</button>
    <label class="info"><input type="checkbox" id="countIn" checked> Cuenta atrás</label>
  </div>
  <div class="tempo">
    <label class="info" for="bpm">Tempo: <b id="bpmVal">80</b> BPM</label>
    <input type="range" id="bpm" min="40" max="160" value="80">
  </div>
</div>

<div class="stage" id="stage">
  <svg id="partitura" class="partitura" height="190"></svg>
  <svg class="clave" width="70" height="190" viewBox="0 0 70 190">
    <rect width="70" height="190" fill="#020617"/>
    <text x="8" y="147" font-size="64" fill="#f8fafc">𝄞</text>
  </svg>
  <div class="playhead" id="playhead"></div>
  <div class="cuenta" id="contador"></div>
</div>
<div id="msg"></div>

<div class="panel" style="margin-top:14px">
  <div class="row">
    <input type="file" id="fileXml" accept=".musicxml,.xml">
    <button class="sec" id="btnEjemplo">Melodía de ejemplo</button>
    <button class="sec" id="btnScan" disabled title="Requiere configurar el Worker">Escanear foto (IA)</button>
    <input type="file" id="fileImg" accept="image/*" hidden>
  </div>
  <p class="info" id="infoPartitura"></p>
</div>

<div class="panel info">
  <b>Estado de la plantilla:</b> <span id="estadoTabla"></span>
  <br>Digitaciones transcritas de la plantilla y comprobadas con la flauta.
</div>

<script>
// ============================================================
// 1. NOMBRES, RANGO Y NOTACIÓN
// ============================================================
const NOMBRES = ["Do","Do#","Re","Re#","Mi","Fa","Fa#","Sol","Sol#","La","La#","Si"];
const ORDEN = [];
for (let i = 0; i < 25; i++) {
  const base = NOMBRES[i % 12];
  ORDEN.push(i === 24 ? "Do sobre agudo" : (i < 12 ? base : base + " agudo"));
}
const MIDI_BASE = 60;                     // Do grave de la plantilla = C4
const LETRA_IDX = { C:0, D:1, E:2, F:3, G:4, A:5, B:6 };
const PASOS_MIDI = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
// Para cada clase de altura: [letra, sostenido]. Se usa solo cuando no hay ortografía original.
const PC_SOSTENIDO = [[0,0],[0,1],[1,0],[1,1],[2,0],[3,0],[3,1],[4,0],[4,1],[5,0],[5,1],[6,0]];
const LETRAS_ES = ["Do","Re","Mi","Fa","Sol","La","Si"];

// Posición diatónica: C4 = 28, E4 (línea inferior) = 30, F5 (línea superior) = 38
function infoMidi(midi) {
  const [letra, sost] = PC_SOSTENIDO[((midi % 12) + 12) % 12];
  const oct = Math.floor(midi / 12) - 1;
  return { dIdx: oct * 7 + letra, acc: sost ? 1 : 0 };
}

// Convierte nombres escritos (Reb, Mi#, Fa# agudo, Do sobre agudo...) a la nota de ORDEN
const LETRA = { Do: 0, Re: 2, Mi: 4, Fa: 5, Sol: 7, La: 9, Si: 11 };
const ALTER = { "": 0, "#": 1, "##": 2, "b": -1, "bb": -2 };

function nombreAOrden(txt) {
  const t = String(txt).trim().replace(/♭/g, "b").replace(/♯/g, "#");
  const m = t.match(/^(do|re|mi|fa|sol|la|si)(##|bb|#|b)?(?:\s+(agudo|sobre agudo))?$/i);
  if (!m) return null;
  const letra = m[1][0].toUpperCase() + m[1].slice(1).toLowerCase();
  const sufijo = (m[3] || "").toLowerCase();
  const oct = sufijo === "agudo" ? 5 : sufijo === "sobre agudo" ? 6 : 4;
  const midi = (oct + 1) * 12 + LETRA[letra] + ALTER[(m[2] || "").toLowerCase()];
  const i = midi - MIDI_BASE;
  return i >= 0 && i <= 24 ? ORDEN[i] : null;
}

// ============================================================
// 2. TABLA DE DIGITACIONES
// holes = [dedo1, dedo2, dedo3, dedo4, dedo5, dedo6, dedo7, pulgar]
// 1 = tapado · 0 = abierto · 0.5 = medio agujero
// ============================================================
const TABLA_PLANTILLA = {};
ORDEN.forEach(n => TABLA_PLANTILLA[n] = { holes: [0,0,0,0,0,0,0,0], verificada: false });

const DIGITACIONES_PLANTILLA = {
  "Do#":            [1,1,1,1,1,1,0.5,1],
  "Re":             [1,1,1,1,1,1,0,1],
  "Re#":            [1,1,1,1,1,0.5,0,1],
  "Mi":             [1,1,1,1,1,0,0,1],
  "Fa":             [1,1,1,1,0,0,0,1],
  "Fa#":            [1,1,1,0,1,1,1,1],
  "Sol":            [1,1,1,0,0,0,0,1],
  "Sol#":           [1,1,0,1,1,0,0,1],
  "La":             [1,1,0,0,0,0,0,1],
  "La#":            [1,0,1,0,0,0,0,1],
  "Si":             [1,0,0,0,0,0,0,1],
  "Do agudo":       [0,1,0,0,0,0,0,1],
  "Do# agudo":      [1,1,0,0,0,0,0,0],
  "Re agudo":       [0,1,0,0,0,0,0,0],
  "Re# agudo":      [1,1,1,1,1,0.5,0,0.5],
  "Mi agudo":       [1,1,1,1,1,0,0,0.5],
  "Fa agudo":       [1,1,1,1,0,0,0,0.5],
  "Fa# agudo":      [1,1,1,0,1,0,0,0.5],
  "Sol agudo":      [1,1,1,0,0,0,0,0.5],
  "Sol# agudo":     [1,1,0,1,0,0,0,0.5],
  "La agudo":       [1,1,0,0,0,0,0,0.5],
  "La# agudo":      [1,1,0,1,1,1,0,0.5],
  "Si agudo":       [1,1,0,1,1,0,0,0.5],
  "Do sobre agudo": [1,0,0,1,0,0,0,0.5]
};

Object.entries(DIGITACIONES_PLANTILLA).forEach(([nombre, holes]) => {
  TABLA_PLANTILLA[nombre] = { holes, verificada: true };
});
TABLA_PLANTILLA["Do"] = { holes: [1,1,1,1,1,1,1,1], verificada: true };

// ============================================================
// 3. FIGURAS Y EVENTOS
// ============================================================
const BASES_FIGURA = [[4,"redonda"],[2,"blanca"],[1,"negra"],[0.5,"corchea"],[0.25,"semicorchea"]];

function figuraDe(dur) {
  for (const [b, tipo] of BASES_FIGURA) {
    if (Math.abs(dur - b) < 1e-3) return { tipo, puntos: 0 };
    if (Math.abs(dur - b * 1.5) < 1e-3) return { tipo, puntos: 1 };
    if (Math.abs(dur - b * 1.75) < 1e-3) return { tipo, puntos: 2 };
  }
  // Duración no estándar: se aproxima a la figura más cercana
  let mejor = BASES_FIGURA[0];
  for (const bf of BASES_FIGURA) if (Math.abs(bf[0] - dur) < Math.abs(mejor[0] - dur)) mejor = bf;
  return { tipo: mejor[1], puntos: 0 };
}

let eventos = [];
let compases = [];
let totalBeats = 0;
let bpm = 80;

function freqDeMidi(m) { return 440 * Math.pow(2, (m - 69) / 12); }

function crearEventoMidi(midi, start, dur, extra = {}) {
  const i = midi - MIDI_BASE;
  const fuera = i < 0 || i > 24;
  const base = infoMidi(midi);
  return {
    rest: false,
    nombre: fuera ? `fuera de rango (MIDI ${midi})` : ORDEN[i],
    midi, freq: freqDeMidi(midi), start, dur, fuera,
    dIdx: extra.dIdx ?? base.dIdx,
    acc: extra.acc ?? base.acc,
    fig: figuraDe(dur)
  };
}

function crearEvento(nombre, start, dur) {
  if (nombre === null) return { rest: true, nombre: "Silencio", start, dur, fig: figuraDe(dur) };
  const i = ORDEN.indexOf(nombre);
  if (i < 0) return { rest: false, nombre, midi: null, freq: null, start, dur, fuera: true, dIdx: 34, acc: 0, fig: figuraDe(dur) };
  return crearEventoMidi(MIDI_BASE + i, start, dur);
}

function setEventos(lista, comp) {
  eventos = lista;
  totalBeats = lista.length ? Math.max(...lista.map(e => e.start + e.dur)) : 0;
  compases = comp && comp.length ? comp : compasPorDefecto(totalBeats);
  dibujarPartitura();
  actualizarInfo();
  pintar(0);
}

function compasPorDefecto(total) {
  const arr = [];
  for (let b = 0; b <= total; b += 4) arr.push({ beat: b, num: 4, den: 4, cambio: b === 0 });
  return arr;
}

function melodiaEjemplo() {
  const pasos = [["Do",1],["Re",1],["Mi",1],["Fa",1],["Sol",2],["Sol",1],["Do agudo",2],["Sol",2],[null,1],["Do",2]];
  let t = 0;
  return pasos.map(([n, d]) => { const e = crearEvento(n, t, d); t += d; return e; });
}

// ============================================================
// 4. LECTOR MUSICXML (notas, silencios, compases y ortografía original)
// ============================================================
function parseMusicXML(texto) {
  const doc = new DOMParser().parseFromString(texto, "application/xml");
  if (doc.querySelector("parsererror")) throw new Error("el archivo no es un XML válido");
  const part = doc.querySelector("part");
  if (!part) throw new Error("no se encontró ninguna parte musical");

  const tempoEl = doc.querySelector("sound[tempo]");
  const tempo = tempoEl ? Math.round(parseFloat(tempoEl.getAttribute("tempo"))) : null;

  const numTag = (el, tag) => { const t = el.querySelector(tag); return t ? parseFloat(t.textContent) : 0; };

  let div = 1, cursor = 0;
  let compasActual = { num: 4, den: 4 };
  const lista = [], compases = [];

  for (const m of part.children) {
    if (m.tagName !== "measure") continue;

    const attrs = Array.from(m.children).find(c => c.tagName === "attributes");
    const tiempo = attrs && attrs.querySelector("time");
    if (tiempo) {
      compasActual = {
        num: parseInt(tiempo.querySelector("beats").textContent, 10),
        den: parseInt(tiempo.querySelector("beat-type").textContent, 10)
      };
    }
    compases.push({ beat: cursor, ...compasActual, cambio: !!tiempo });

    for (const el of m.children) {
      if (el.tagName === "attributes") {
        const d = el.querySelector("divisions");
        if (d) div = parseFloat(d.textContent);
      } else if (el.tagName === "backup") {
        cursor -= numTag(el, "duration") / div;
      } else if (el.tagName === "forward") {
        cursor += numTag(el, "duration") / div;
      } else if (el.tagName === "note") {
        if (el.querySelector("chord") || el.querySelector("grace")) continue;
        const dur = numTag(el, "duration") / div;

        if (el.querySelector("rest")) {
          lista.push(crearEvento(null, cursor, dur));
        } else {
          const p = el.querySelector("pitch");
          const step = p.querySelector("step").textContent;
          const alter = Math.round(numTag(p, "alter"));
          const oct = parseInt(p.querySelector("octave").textContent, 10);
          const midi = (oct + 1) * 12 + PASOS_MIDI[step] + alter;
          const extra = { dIdx: oct * 7 + LETRA_IDX[step], acc: alter };

          const ultimo = lista[lista.length - 1];
          const ligadura = el.querySelector('tie[type="stop"]');
          if (ligadura && ultimo && !ultimo.rest && ultimo.midi === midi &&
              Math.abs(ultimo.start + ultimo.dur - cursor) < 1e-6) {
            ultimo.dur += dur;
            ultimo.fig = figuraDe(ultimo.dur);
          } else {
            lista.push(crearEventoMidi(midi, cursor, dur, extra));
          }
        }
        cursor += dur;
      }
    }
  }
  return { eventos: lista, tempo, compases };
}

// ============================================================
// 5. AUDIO: TODO SE PROGRAMA EN EL RELOJ DE AUDIO
// ============================================================
let ac = null, reproduciendo = false, offset = 0, beatZero = 0, nodos = [], rafId = 0;
const spb = () => 60 / bpm;

function getAC() {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === "suspended") ac.resume();
  return ac;
}

function tono(freq, t, dur, vol = 0.25) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "sine";
  o.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.04);
  g.gain.setValueAtTime(vol, Math.max(t + 0.04, t + dur - 0.06));
  g.gain.linearRampToValueAtTime(0, t + dur);
  o.connect(g).connect(ac.destination);
  o.start(t);
  o.stop(t + dur + 0.02);
  nodos.push(o);
}

function clic(t, acento) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.value = acento ? 1500 : 1000;
  g.gain.setValueAtTime(0.3, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
  o.connect(g).connect(ac.destination);
  o.start(t);
  o.stop(t + 0.06);
  nodos.push(o);
}

function pararNodos() {
  nodos.forEach(n => { try { n.stop(); } catch (e) {} });
  nodos = [];
}

function beatActual() {
  if (!reproduciendo) return offset;
  return (ac.currentTime - beatZero) / spb();
}

function play() {
  if (!eventos.length) { mensaje("Carga una melodía primero."); return; }
  getAC();
  pararNodos();

  const ahora = ac.currentTime + 0.1;
  const cuenta = offset === 0 && document.getElementById("countIn").checked;
  beatZero = cuenta ? ahora + 4 * spb() : ahora - offset * spb();

  if (cuenta) for (let k = 0; k < 4; k++) clic(ahora + k * spb(), k === 0);

  for (const e of eventos) {
    if (e.rest || !e.freq) continue;
    const fin = e.start + e.dur;
    if (fin <= offset) continue;
    const inicio = Math.max(e.start, offset);
    const t = beatZero + inicio * spb();
    const dur = (fin - inicio) * spb() * 0.92;
    tono(e.freq, t, dur);
  }

  reproduciendo = true;
  document.getElementById("btnPlay").textContent = "⏸ Pausar";
  cancelAnimationFrame(rafId);
  bucle();
}

function pausar() {
  if (!reproduciendo) return;
  offset = Math.max(0, Math.min(beatActual(), totalBeats));
  reproduciendo = false;
  pararNodos();
  cancelAnimationFrame(rafId);
  document.getElementById("btnPlay").textContent = "▶ Reproducir";
  pintar(offset);
}

function parar() {
  reproduciendo = false;
  offset = 0;
  pararNodos();
  cancelAnimationFrame(rafId);
  document.getElementById("btnPlay").textContent = "▶ Reproducir";
  pintar(0);
}

function bucle() {
  const b = beatActual();
  if (b >= totalBeats) { parar(); return; }
  pintar(b);
  rafId = requestAnimationFrame(bucle);
}

// ============================================================
// 6. GEOMETRÍA DEL PENTAGRAMA
// ============================================================
const PPB = 70;           // píxeles por tiempo (negra)
const X0 = 100;           // inicio de la primera barra dentro de la partitura
const STAFF_TOP = 104;    // línea superior del pentagrama
const GAP = 9;            // separación entre líneas
const STAFF_BOT = STAFF_TOP + 4 * GAP;
const NAME_Y = STAFF_BOT + 34;
const PLICA = 30, HALF_W = 5.5;

const yDeIdx = k => STAFF_BOT - (k - 30) * GAP / 2;
const xNota = e => X0 + e.start * PPB + 14;

let NOTAS_DOM = [];
let activoAnt = -1;

// Figura de la digitación: la de la plantilla en miniatura
let uidFlauta = 0;
function fluteInner(holes) {
  const uid = "f" + (++uidFlauta);
  const ys = [30, 50, 70, 90, 110, 130, 150];
  const cx = 45, r = 8;
  const agujero = (x, y, st, clave) => {
    if (st === 0.5) {
      const id = `${uid}-${clave}`;
      return `<clipPath id="${id}"><rect x="${x - r}" y="${y}" width="${2 * r}" height="${r}"/></clipPath>
        <circle cx="${x}" cy="${y}" r="${r}" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
        <circle cx="${x}" cy="${y}" r="${r}" fill="#f1f5f9" clip-path="url(#${id})"/>`;
    }
    const fill = st === 1 ? "#f1f5f9" : "#0f172a";
    return `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="#64748b" stroke-width="2"/>`;
  };
  let s = `<rect x="36" y="8" width="18" height="170" rx="9" fill="#1e293b" stroke="#64748b" stroke-width="2"/>`;
  for (let k = 0; k < 7; k++) s += agujero(cx, ys[k], holes[k], "d" + k);
  s += agujero(62, ys[1], holes[7], "p");
  return s;
}

const ledger = (cx, y) => `<line class="linea" x1="${cx - 11}" x2="${cx + 11}" y1="${y}" y2="${y}"/>`;
const simboloAlt = a => ({ 1: "♯", 2: "×", [-1]: "♭", [-2]: "♭♭" })[a] || "";

function etiqueta(e) {
  if (e.rest) return "";
  if (e.fuera) return "?";
  const letra = LETRAS_ES[((e.dIdx % 7) + 7) % 7];
  const oct = Math.floor(e.dIdx / 7);
  const marca = oct >= 6 ? "″" : oct === 5 ? "′" : oct <= 3 ? "," : "";
  return letra + simboloAlt(e.acc) + marca;
}

function silencioSVG(e, cx) {
  const tipo = e.fig.tipo;
  if (tipo === "redonda") return `<rect x="${cx - 7}" y="${STAFF_TOP + GAP}" width="14" height="4" fill="#94a3b8"/>`;
  if (tipo === "blanca") return `<rect x="${cx - 7}" y="${STAFF_TOP + 2 * GAP - 4}" width="14" height="4" fill="#94a3b8"/>`;
  const m = STAFF_TOP + 2 * GAP;
  return `<path d="M${cx - 3} ${m - 9} l6 6 l-6 6 l5 6 l-6 5" fill="none" stroke="#94a3b8" stroke-width="2"/>`;
}

function banderas(x, y, arriba, doble) {
  const d = arriba ? 1 : -1;
  let s = `<path class="bandera" d="M${x} ${y} c 9 ${4 * d} 10 ${12 * d} 2 ${22 * d}"/>`;
  if (doble) s += `<path class="bandera" d="M${x} ${y + 6 * d} c 9 ${4 * d} 10 ${12 * d} 2 ${22 * d}"/>`;
  return s;
}

// ============================================================
// 7. RENDER DE LA PARTITURA
// ============================================================
function dibujarPartitura() {
  const svg = document.getElementById("partitura");
  const finX = X0 + totalBeats * PPB + 200;
  svg.setAttribute("width", finX);
  const xB = b => X0 + b * PPB;

  // Pentagrama, compases y barras
  let fondo = "";
  for (let k = 0; k < 5; k++) {
    const y = STAFF_TOP + k * GAP;
    fondo += `<line x1="-1200" y1="${y}" x2="${finX}" y2="${y}" stroke="#475569" stroke-width="1.2"/>`;
  }
  compases.forEach(c => {
    const x = xB(c.beat);
    fondo += `<line x1="${x}" y1="${STAFF_TOP}" x2="${x}" y2="${STAFF_BOT}" stroke="#94a3b8" stroke-width="1.4"/>`;
    if (c.cambio) {
      const xc = c.beat === 0 ? x - 24 : x + 6;
      fondo += `<text class="comp" x="${xc}" y="${STAFF_TOP + 2 * GAP - 1}">${c.num}</text>`;
      fondo += `<text class="comp" x="${xc}" y="${STAFF_TOP + 4 * GAP - 1}">${c.den}</text>`;
    }
  });
  const xFin = xB(totalBeats);
  fondo += `<line x1="${xFin}" y1="${STAFF_TOP}" x2="${xFin}" y2="${STAFF_BOT}" stroke="#94a3b8" stroke-width="3"/>`;

  // Grupos de corcheas unidas por viga (dentro del mismo tiempo)
  const grupoDe = new Array(eventos.length).fill(null);
  const grupos = [];
  let actual = null;
  eventos.forEach((e, i) => {
    const esCorchea = !e.rest && e.fig.tipo === "corchea";
    if (esCorchea && actual && Math.floor(e.start) === Math.floor(actual.ult.start)) {
      actual.idx.push(i);
      actual.ult = e;
    } else if (esCorchea) {
      actual = { idx: [i], ult: e };
      grupos.push(actual);
    } else {
      actual = null;
    }
    if (esCorchea) grupoDe[i] = actual;
  });

  let vigas = "";
  grupos.forEach(g => {
    if (g.idx.length < 2) return;
    const media = g.idx.reduce((s, j) => s + eventos[j].dIdx, 0) / g.idx.length;
    g.arriba = media < 34;
    const ys = g.idx.map(j => {
      const cy = yDeIdx(eventos[j].dIdx);
      return g.arriba ? cy - PLICA : cy + PLICA;
    });
    g.yViga = g.arriba ? Math.min(...ys) : Math.max(...ys);
    const x1 = xNota(eventos[g.idx[0]]) + (g.arriba ? HALF_W : -HALF_W);
    const x2 = xNota(eventos[g.idx[g.idx.length - 1]]) + (g.arriba ? HALF_W : -HALF_W);
    vigas += `<rect x="${Math.min(x1, x2)}" y="${g.arriba ? g.yViga : g.yViga - 4}" width="${Math.abs(x2 - x1)}" height="4" fill="#f8fafc"/>`;
  });

  // Notas, silencios y digitaciones en miniatura
  const notasSVG = eventos.map((e, i) => {
    const cx = xNota(e);
    if (e.rest) return `<g class="nota" data-i="${i}">${silencioSVG(e, cx)}</g>`;

    const cy = yDeIdx(e.dIdx);
    const g = grupoDe[i];
    const agrupada = g && g.idx.length >= 2;
    const arriba = agrupada ? g.arriba : e.dIdx < 34;
    const finY = agrupada ? g.yViga : (arriba ? cy - PLICA : cy + PLICA);
    const sx = cx + (arriba ? HALF_W : -HALF_W);
    const hueca = e.fig.tipo === "redonda" || e.fig.tipo === "blanca";
    const pend = !TABLA_PLANTILLA[e.nombre] || !TABLA_PLANTILLA[e.nombre].verificada;

    let s = "";
    if (e.dIdx < 30) for (let k = 28; k >= e.dIdx; k -= 2) s += ledger(cx, yDeIdx(k));
    if (e.dIdx > 38) for (let k = 40; k <= e.dIdx; k += 2) s += ledger(cx, yDeIdx(k));
    if (e.acc) s += `<text class="alt" x="${cx - 16}" y="${cy + 5}">${simboloAlt(e.acc)}</text>`;
    if (e.fig.tipo !== "redonda") s += `<line class="plica" x1="${sx}" x2="${sx}" y1="${cy}" y2="${finY}"/>`;
    if (!agrupada && (e.fig.tipo === "corchea" || e.fig.tipo === "semicorchea")) {
      s += banderas(sx, finY, arriba, e.fig.tipo === "semicorchea");
    }
    s += `<ellipse class="cabeza ${hueca ? "hueca" : "solida"}" cx="${cx}" cy="${cy}" rx="6" ry="4.5" transform="rotate(-20 ${cx} ${cy})"/>`;
    for (let p = 0; p < e.fig.puntos; p++) {
      const py = e.dIdx % 2 === 0 ? cy - GAP / 2 : cy;
      s += `<circle class="pt" cx="${cx + 10 + p * 4}" cy="${py}" r="1.8"/>`;
    }

    const t = TABLA_PLANTILLA[e.nombre];
    const holes = t ? t.holes : [0,0,0,0,0,0,0,0];
    s += `<svg class="mini" x="${cx - 9}" y="2" width="18" height="76" viewBox="30 4 42 178">${fluteInner(holes)}</svg>`;
    s += `<text class="nombre" x="${cx}" y="${NAME_Y}">${etiqueta(e)}</text>`;

    return `<g class="nota${pend ? " pend" : ""}" data-i="${i}">${s}</g>`;
  }).join("");

  svg.innerHTML = `<g id="grupo">${fondo}${notasSVG}${vigas}</g>`;
  NOTAS_DOM = Array.from(svg.querySelectorAll("g.nota"));
  activoAnt = -1;
}

// ============================================================
// 8. POSICIÓN, RESALTADO Y CUENTA ATRÁS
// ============================================================
function pintar(b) {
  const beat = Math.min(Math.max(b, 0), totalBeats);
  const px = document.getElementById("stage").clientWidth * 0.3;
  const grupo = document.getElementById("grupo");
  if (grupo) grupo.setAttribute("transform", `translate(${px - (X0 + 14 + beat * PPB)},0)`);

  const i = eventos.findIndex(e => beat >= e.start && beat < e.start + e.dur);
  if (i !== activoAnt) {
    if (activoAnt >= 0 && NOTAS_DOM[activoAnt]) NOTAS_DOM[activoAnt].classList.remove("act");
    if (i >= 0 && NOTAS_DOM[i]) NOTAS_DOM[i].classList.add("act");
    activoAnt = i;
  }

  document.getElementById("contador").textContent = (reproduciendo && b < 0) ? Math.ceil(-b) : "";
}

// ============================================================
// 9. INFORMACIÓN Y MENSAJES
// ============================================================
function actualizarInfo() {
  const pend = eventos.filter(e => !e.rest && (!TABLA_PLANTILLA[e.nombre] || !TABLA_PLANTILLA[e.nombre].verificada)).length;
  const fuera = eventos.filter(e => e.fuera).length;
  document.getElementById("infoPartitura").textContent =
    `${eventos.length} eventos · ${compases.length} compases · ${totalBeats} tiempos · ${bpm} BPM` +
    (pend ? ` · ${pend} notas con digitación pendiente` : "") +
    (fuera ? ` · ${fuera} notas fuera de rango` : "");

  const verificadas = ORDEN.filter(n => TABLA_PLANTILLA[n].verificada).length;
  document.getElementById("estadoTabla").textContent = `${verificadas} de ${ORDEN.length} digitaciones verificadas`;
}

function mensaje(t) { document.getElementById("msg").textContent = t; }

// ============================================================
// 10. CONTROLES
// ============================================================
document.getElementById("btnPlay").addEventListener("click", () => reproduciendo ? pausar() : play());
document.getElementById("btnStop").addEventListener("click", parar);

document.getElementById("bpm").addEventListener("input", ev => {
  const estaba = reproduciendo;
  if (estaba) pausar();
  bpm = parseInt(ev.target.value, 10);
  document.getElementById("bpmVal").textContent = bpm;
  actualizarInfo();
  if (estaba) play();
});

document.getElementById("btnEjemplo").addEventListener("click", () => {
  parar();
  setEventos(melodiaEjemplo());
  mensaje("");
});

document.getElementById("fileXml").addEventListener("change", async ev => {
  const f = ev.target.files[0];
  if (!f) return;
  try {
    const res = parseMusicXML(await f.text());
    parar();
    if (res.tempo) {
      bpm = Math.min(160, Math.max(40, res.tempo));
      document.getElementById("bpm").value = bpm;
      document.getElementById("bpmVal").textContent = bpm;
    }
    setEventos(res.eventos, res.compases);
    mensaje("");
  } catch (err) {
    mensaje("Error al leer el archivo: " + err.message);
  }
});

// ============================================================
// 11. ESCANEO CON IA (requiere el Worker)
// ============================================================
const PROXY_URL = ""; // p. ej. "https://partituras.TU-SUBDOMINIO.workers.dev/analizar"
const btnScan = document.getElementById("btnScan");
btnScan.disabled = !PROXY_URL;
btnScan.addEventListener("click", () => document.getElementById("fileImg").click());

document.getElementById("fileImg").addEventListener("change", async ev => {
  const f = ev.target.files[0];
  if (!f || !PROXY_URL) return;
  mensaje("Analizando la imagen…");
  try {
    const base64 = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result.split(",")[1]);
      r.onerror = rej;
      r.readAsDataURL(f);
    });
    const resp = await fetch(PROXY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ imagen: base64, mime: f.type })
    });
    const { notas } = await resp.json();

    const normalizadas = notas.map(n => n === null ? null : (nombreAOrden(n) ?? n));
    const noReconocidas = normalizadas.filter(n => n !== null && !ORDEN.includes(n));

    parar();
    let t = 0;
    setEventos(normalizadas.map(n => { const e = crearEvento(n, t, 1); t++; return e; }));

    if (noReconocidas.length) {
      mensaje(`Notas no reconocidas: ${noReconocidas.join(", ")}. Revísalas.`);
    } else {
      mensaje("Revisa la secuencia: la IA puede equivocarse. Lo fiable es MusicXML.");
    }
  } catch (err) {
    mensaje("Error al analizar la imagen: " + err.message);
  }
});

// ============================================================
// 12. INICIO
// ============================================================
setEventos(melodiaEjemplo());
window.addEventListener("resize", () => pintar(beatActual()));
</script>
